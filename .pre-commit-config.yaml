# Install once: uv run pre-commit install
# Uses ruff from uv.lock, so the hook and CI (ci.yml → Lint) check with the same version and settings.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
