# Excel styling for `mapcan export xlsx --style <file>`.
# Any parameter can be omitted: the default value is used.

font: Calibri
font_size: 10
header_fill: "1F4E79"        # background of table headers
header_font_color: "FFFFFF"
device_fill: "DDEBF7"        # background of device cells
frame_fill: "F2F2F2"         # background of frame cells
border_color: "A6A6A6"
unused_font_color: "A6A6A6"  # unused function codes

# Set and order of the columns of the Contents sheet:
# device, frame, id, byte, bits, signal, description, encoding, values
columns: [device, frame, id, byte, bits, signal, description, encoding, values]

# Maximum width of the columns (characters); the actual one fits the content.
max_width:
  description: 40
  values: 70

bitmap_cell_width: 13
