mapcan: 1
document:
  title: Карта с ошибками
  language: ru
lint:
  signal_name: snake_case
buses:
  - name: bus1
    protocol: canopen
    devices:
      - name: imd
        node_id: 0x21
        frames:
          - name: imd_data
            type: pdo_tx2
            length: 8
            cycle_ms: 100
            signals:
              - name: bus_voltage
                encoding: scaled
                description: Напряжение
                byte: 6
                byte_length: 2
                factor: 0,1
                unit: В
          - name: imd_state
            id: 0х196
            type: pdo_tx1
            length: 2
            cycle_ms: 100
            signals:
              - name: cmu_status
                encoding: enum
                description: Статус
                byte: 0
                byte_length: 1
                values:
                  0: NO DATA
                  1: OK
                  2: NO_DATA_X
              - name: wide
                encoding: raw
                description: Слишком широкий
                byte: 1
                byte_length: 2
              - name: tiny
                encoding: enum
                description: Маленький
                byte: 0
                bit: 7
                bit_length: 2
                values:
                  5: TOO_BIG
      - name: pcu
        node_id: 0x23
        frames:
          - name: pcu_state
            type: pdo_tx1
            length: 8
            cycle_ms: 100
            signals:
              - name: dc_status
                encoding: enum
                description: Состояние
                byte: 0
                byte_length: 1
                values: {0: DC_INIT, 1: NO_DATA}
              - name: error_code
                encoding: bitfield
                description: Ошибки
                byte: 1
                byte_length: 1
                flags:
                  - {bit: 0, name: dc_status}
                  - {bit: 8, name: OutOfRange}
          - name: pcu_dup
            id: 0x1A3
            length: 8
            cycle_ms: 50
            trigger: event
            signals:
              - name: muxed
                encoding: raw
                description: x
                byte: 0
                byte_length: 1
                mux: 1
