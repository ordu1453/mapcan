[project]
name = "canmap"
version = "0.7.3"
description = "YAML-карта сигналов CAN как единственный источник правды: проверка, Excel/PDF/Markdown/HTML, DBC, C/Python-код"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "typst>=0.13",
    "cantools>=39",
    "pillow>=10",              # логотип в Excel (openpyxl)
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Этап 8 (работа с шиной) — зарезервировано.
bus = ["python-can>=4.3"]
# Отдельное окно приложения (`canmap app`); без него редактор открывается в браузере.
desktop = ["pywebview>=5"]

[project.scripts]
canmap = "canmap.cli:main"

[project.gui-scripts]
canmap-app = "canmap.launcher:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4", "httpx>=0.27"]
# Сборка canmap.exe и установщика (packaging/, .github/workflows/release.yml).
package = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Собранный фронтенд (src/canmap/web/static, из web/ → npm run build) входит в пакет:
# Node.js пользователям не нужен.
packages = ["src/canmap"]

[tool.hatch.build.targets.sdist]
include = ["src/canmap", "schema", "examples", "docs", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007", "UP045", "UP042", "B008"]
