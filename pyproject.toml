[project]
name = "mapcan"
version = "0.23.0"
description = "A YAML map of CAN signals as the single source of truth: validation, Excel/PDF/Markdown/HTML, DBC, C/Python code"
# readme: built from README.md with absolute links for PyPI (see fancy-pypi-readme below)
dynamic = ["readme"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "src/mapcan/fonts/OFL*.txt"]
keywords = ["CAN", "CAN FD", "CANopen", "SAE J1939", "DBC", "code generation", "automotive", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
]
# The core: validation, DBC/EDS/Markdown/HTML, code generation (CI, firmware builds). The editor, PDF and Excel
# are extras: `pip install "mapcan[all]"` for everything (src/mapcan/extras.py names them in messages).
dependencies = [
    "pydantic>=2.7,<3",
    # ruamel changes its API between minor releases: raised after testing (Dependabot)
    "ruamel.yaml>=0.18,<0.20",
    # libyaml's parser for reading maps fast in the editors (loader._fast_load); ruamel's is used without it
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "cantools>=39",
]

[project.urls]
Homepage = "https://github.com/ordu1453/mapcan"
Documentation = "https://github.com/ordu1453/mapcan/blob/main/docs/format.md"
Repository = "https://github.com/ordu1453/mapcan"
Issues = "https://github.com/ordu1453/mapcan/issues"
Changelog = "https://github.com/ordu1453/mapcan/releases"

[project.optional-dependencies]
# The editor in a browser (`mapcan serve`, `mapcan app --browser`).
web = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "python-multipart>=0.0.9"]
# PDF (`mapcan export pdf`): the Typst compiler.
pdf = ["typst>=0.13"]
# Excel (`mapcan export xlsx`); pillow puts the logo into the sheet.
xlsx = ["openpyxl>=3.1", "pillow>=10"]
# Language server (`mapcan lsp`) for the VS Code extension and other editors.
lsp = ["pygls>=2.0,<3"]
# The app (`mapcan app`): the editor in its own window, with every export it offers.
desktop = ["mapcan[web,pdf,xlsx]", "pywebview>=5"]
all = ["mapcan[web,pdf,xlsx,lsp,desktop]"]

[project.scripts]
mapcan = "mapcan.cli:main"

[project.gui-scripts]
mapcan-app = "mapcan.launcher:main"

[dependency-groups]
# The project itself with the lsp and desktop extras: a plain `uv sync` would otherwise uninstall them.
dev = [
    "mapcan[all]",
    "pytest>=8",
    "ruff>=0.5",
    "pre-commit>=4",
    "jsonschema>=4",
    "httpx>=0.27",
    "canopen>=2.3",
]
# Building mapcan.exe and the installer (packaging/, .github/workflows/release.yml).
package = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

# The PyPI page is README.md with its relative links and images pointing to GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/ordu1453/mapcan/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/ordu1453/mapcan/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/ordu1453/mapcan/blob/main/\1)'

[tool.hatch.build.targets.wheel]
# The built frontend (src/mapcan/web/static, from web/ → npm run build) is in the package:
# users do not need Node.js.
packages = ["src/mapcan"]

[tool.hatch.build.targets.wheel.force-include]
# Examples for the start screen ("Examples").
"examples" = "mapcan/examples"

[tool.hatch.build.targets.sdist]
# Anchored to the root: a bare "README.md" also matches every README in node_modules.
include = ["/src/mapcan", "/schema", "/examples", "/docs", "/tests", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007", "UP045", "UP042", "B008"]
