name: codeql

# Code scanning of the Python package, the web editor and the VS Code extension (TypeScript), and of the
# workflows themselves. Results are in Security → Code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"      # weekly, for new queries

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the results
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The built bundle and third-party code are not ours to scan
          config: |
            paths-ignore:
              - src/mapcan/web/static
              - "**/node_modules"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
