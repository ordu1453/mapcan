name: release

# Releasing a version: bump the version (pyproject.toml, src/mapcan/__init__.py, web/package.json),
# commit, and push the tag vX.Y.Z. The workflow checks, builds and publishes a GitHub Release:
#   mapcan-X.Y.Z-setup.exe          the Windows installer
#   mapcan-X.Y.Z-windows-x64.zip    the same build without installing
#   mapcan-X.Y.Z-linux-x64.tar.gz   the Linux build (the editor opens in the browser)
#   mapcan-X.Y.Z-py3-none-any.whl   for uv tool install / pipx
#   Docker image ghcr.io/<owner>/mapcan:X.Y.Z and :latest
# A manual run (Actions → release → Run workflow) is a trial build without publishing.
#
# GitHub-hosted runners only (windows-latest, ubuntu-latest), as in ci.yml.
# The Docker image and the Linux build run on ubuntu-latest and do not hold up publishing the release:
# the Linux archive is uploaded to the already published release (linux-upload).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - id: v
        name: Tag matches package version
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          init=$(grep -m1 '^__version__' src/mapcan/__init__.py | cut -d'"' -f2)
          web=$(node -p "require('./web/package.json').version")
          echo "pyproject=$v __init__=$init web=$web ref=$GITHUB_REF_NAME"
          if [ "$v" != "$init" ] || [ "$v" != "$web" ]; then
            echo "::error::the versions in pyproject.toml, src/mapcan/__init__.py and web/package.json differ"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the package version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip-linux: true   # the Linux test runs in ci on main; the release does not wait for cloud runners

  python:
    needs: [version, ci]
    runs-on: ubuntu-latest
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/upload-artifact@v6
        with:
          name: dist-python
          path: dist/*
          if-no-files-found: error

  windows:
    needs: [version, ci]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --no-dev --extra desktop --group package
      - name: Build (PyInstaller)
        run: uv run --no-sync pyinstaller packaging/mapcan.spec --noconfirm
      - name: Smoke test
        run: |
          set -e
          out=$(dist/mapcan/mapcan.exe --version | tr -d '\r')
          echo "$out"
          [ "$out" = "mapcan $VERSION" ]
          test -f dist/mapcan/mapcan-app.exe
          dist/mapcan/mapcan.exe validate examples/minimal.yaml
          dist/mapcan/mapcan.exe build examples/vehicle-can.yaml -o smoke
          test -s smoke/vehicle-can.pdf && test -s smoke/vehicle-can.xlsx
      - name: Installer (Inno Setup)
        shell: powershell
        run: |
          # Installed Inno Setup or an own copy in the runner's tool cache (installed without administrator rights).
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $local = Join-Path $env:RUNNER_TOOL_CACHE "innosetup"
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $local "ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -UseBasicParsing -OutFile $setup `
              "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
            Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$local`""
            if (-not (Test-Path $iscc)) { Write-Error "Inno Setup was not installed to $local"; exit 1 }
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" packaging\mapcan.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Portable zip
        shell: powershell
        run: Compress-Archive -Path dist\mapcan\* -DestinationPath "dist\mapcan-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: dist-windows
          path: |
            dist/mapcan-*-setup.exe
            dist/mapcan-*-windows-x64.zip
          if-no-files-found: error

  linux:
    needs: [version, ci]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        # Without the desktop extra: pywebview on Linux needs GTK/Qt; without it mapcan-app opens the browser.
        run: uv sync --locked --no-dev --group package
      - name: Build (PyInstaller)
        run: uv run --no-sync pyinstaller packaging/mapcan.spec --noconfirm
      - name: Smoke test
        run: |
          set -e
          out=$(dist/mapcan/mapcan --version)
          echo "$out"
          [ "$out" = "mapcan $VERSION" ]
          test -f dist/mapcan/mapcan-app
          dist/mapcan/mapcan validate examples/minimal.yaml
          dist/mapcan/mapcan build examples/vehicle-can.yaml -o smoke
          test -s smoke/vehicle-can.pdf && test -s smoke/vehicle-can.xlsx
      - name: Archive
        run: tar -czf "dist/mapcan-$VERSION-linux-x64.tar.gz" -C dist mapcan
      - uses: actions/upload-artifact@v6
        with:
          name: dist-linux
          path: dist/mapcan-*-linux-x64.tar.gz
          if-no-files-found: error

  docker:
    needs: [version, ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest

  publish:
    needs: [version, python, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          # checkout leaves a lightweight copy of the tag: fetch the annotation again.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          {
            git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d'
            echo
            echo "## Installation"
            echo
            echo "- **Windows:** download \`mapcan-$VERSION-setup.exe\` and run it. No administrator rights required."
            echo "  Without installing: \`mapcan-$VERSION-windows-x64.zip\` (run \`mapcan-app.exe\`)."
            echo "- **Linux (x64):** extract \`mapcan-$VERSION-linux-x64.tar.gz\` and run \`mapcan/mapcan-app\` (the editor opens in the browser) or \`mapcan/mapcan\` (command line)."
            echo "- **Python 3.12:** \`uv tool install \"mapcan[desktop] @ https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/mapcan-$VERSION-py3-none-any.whl\"\`"
            echo "- **Docker:** \`docker run --rm -v \"\$PWD:/work\" ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION build mapcan.yaml -o build\`"
          } > notes.md
          cat notes.md
      - name: Publish GitHub Release
        run: |
          gh release create "$TAG" assets/* --verify-tag --title "mapcan $VERSION" \
            --notes-file notes.md --generate-notes

  linux-upload:
    needs: [linux, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist-linux
          path: assets
      - name: Upload to the release
        working-directory: assets
        run: |
          # If the Linux build finished before publish, the archive and its checksum are already in the release
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q -- '-linux-x64\.tar\.gz$'; then
            echo "Linux archive is already in the release"
            exit 0
          fi
          gh release download "$TAG" -p SHA256SUMS.txt
          sha256sum mapcan-*-linux-x64.tar.gz >> SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "$TAG" mapcan-*-linux-x64.tar.gz
          gh release upload "$TAG" SHA256SUMS.txt --clobber
