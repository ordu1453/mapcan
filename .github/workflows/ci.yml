name: ci

on:
  push:
    branches: ["**"]     # теги проверяет release.yml (вызывает этот workflow)
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Schema is up to date
        run: uv run canmap schema -o schema/canmap.schema.json && git diff --exit-code schema/
      - name: Tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Typecheck and build
        working-directory: web
        run: npm ci && npm run build
      - name: Built bundle is committed and up to date
        run: git diff --exit-code src/canmap/web/static

  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Validate examples
        shell: bash
        run: |
          for f in $(find examples -name '*.yaml'); do uv run canmap validate "$f" --strict; done
      - name: Build documents and code for every example
        shell: bash
        run: |
          for f in $(find examples -name '*.yaml'); do
            uv run canmap build "$f" -o "build/$(basename "$(dirname "$f")")-$(basename "$f" .yaml)"               --pdf-template canmap --pdf-template gost-2.105
          done
      - uses: actions/upload-artifact@v4
        with:
          name: canmap-build
          path: build/
