name: ci

# The main runner is a self-hosted Windows one (the developer's machine), without a queue of cloud runners.
# If it is not available, switch everything to GitHub runners:  gh variable set CI_RUNNER --body github
# Back to the own runner:                                      gh variable delete CI_RUNNER
# The Linux test always runs on ubuntu-latest (GitHub).

on:
  push:
    branches: ["**"]     # tags are checked by release.yml (it calls this workflow)
  pull_request:
  workflow_call:
    inputs:
      skip-linux:
        description: Do not run the test on Linux (ubuntu-latest)
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'windows-latest' || fromJSON('["self-hosted","Windows"]') }}
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra lsp
      - name: Lint
        run: uv run ruff check src tests
      - name: Schema is up to date
        run: uv run mapcan schema -o schema/mapcan.schema.json && git diff --exit-code schema/
      - name: Tests
        run: uv run pytest

  test-linux:
    if: ${{ !inputs.skip-linux }}    # on a plain push inputs is empty, so the test runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra lsp
      - run: uv run pytest

  # A trial build of the Docker image (without publishing): otherwise a broken Dockerfile shows up only
  # in release.yml after the tag.
  docker:
    if: ${{ !inputs.skip-linux }}    # in a release, release.yml builds and publishes the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mapcan:ci

  web:
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","Windows"]') }}
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Typecheck and build
        working-directory: web
        run: npm ci && npm run build
      - name: Frontend tests
        working-directory: web
        run: npm test
      - name: Built bundle is committed and up to date
        run: git diff --exit-code src/mapcan/web/static

  # VS Code extension: types, build, .vsix package and integration tests in a real VS Code
  # (downloaded to vscode/.vscode-test/; the window is in an xvfb virtual display). The language server is from .venv.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra lsp
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Typecheck
        working-directory: vscode
        run: npm ci && npm run typecheck
      - name: Package
        working-directory: vscode
        run: npm run build && npm run package
      - name: Integration tests
        working-directory: vscode
        run: xvfb-run -a npm test

  docs:
    needs: test
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","Windows"]') }}
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Maps only: parts of a map pulled in with include (examples/tractor) have no "mapcan:" key
      - name: Validate examples
        run: |
          for f in $(grep -rlE '^mapcan\s*:' examples --include='*.yaml'); do uv run mapcan validate "$f" --strict; done
      - name: Build documents and code for every example
        run: |
          for f in $(grep -rlE '^mapcan\s*:' examples --include='*.yaml'); do
            uv run mapcan build "$f" -o "build/$(basename "$(dirname "$f")")-$(basename "$f" .yaml)" \
              --pdf-template mapcan --pdf-template gost-2.105
          done
      - uses: actions/upload-artifact@v6
        with:
          name: mapcan-build
          path: build/
