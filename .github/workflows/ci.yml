name: ci

# Основной раннер — self-hosted Windows (машина разработчика), без очереди облачных раннеров.
# Если он недоступен, переключить всё на раннеры GitHub:  gh variable set CI_RUNNER --body github
# Вернуть свой раннер:                                    gh variable delete CI_RUNNER
# Linux-тест всегда идёт на ubuntu-latest (GitHub).

on:
  push:
    branches: ["**"]     # теги проверяет release.yml (вызывает этот workflow)
  pull_request:
  workflow_call:
    inputs:
      skip-linux:
        description: Не запускать тест на Linux (ubuntu-latest)
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'windows-latest' || fromJSON('["self-hosted","Windows"]') }}
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra lsp
      - name: Lint
        run: uv run ruff check src tests
      - name: Schema is up to date
        run: uv run mapcan schema -o schema/mapcan.schema.json && git diff --exit-code schema/
      - name: Tests
        run: uv run pytest

  test-linux:
    if: ${{ !inputs.skip-linux }}    # при обычном push inputs пуст — тест запускается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra lsp
      - run: uv run pytest

  # Пробная сборка Docker-образа (без публикации): иначе поломка Dockerfile всплывает только
  # в release.yml после тега.
  docker:
    if: ${{ !inputs.skip-linux }}    # в релизе образ собирает и публикует release.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mapcan:ci

  web:
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","Windows"]') }}
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Typecheck and build
        working-directory: web
        run: npm ci && npm run build
      - name: Frontend tests
        working-directory: web
        run: npm test
      - name: Built bundle is committed and up to date
        run: git diff --exit-code src/mapcan/web/static

  # Расширение VS Code: типы, сборка, пакет .vsix и интеграционные тесты в настоящем VS Code
  # (скачивается в vscode/.vscode-test/; окно — в виртуальном дисплее xvfb). Языковой сервер — из .venv.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra lsp
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Typecheck
        working-directory: vscode
        run: npm ci && npm run typecheck
      - name: Package
        working-directory: vscode
        run: npm run build && npm run package
      - name: Integration tests
        working-directory: vscode
        run: xvfb-run -a npm test

  docs:
    needs: test
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","Windows"]') }}
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Maps only: parts of a map pulled in with include (examples/tractor) have no "mapcan:" key
      - name: Validate examples
        run: |
          for f in $(grep -rlE '^mapcan\s*:' examples --include='*.yaml'); do uv run mapcan validate "$f" --strict; done
      - name: Build documents and code for every example
        run: |
          for f in $(grep -rlE '^mapcan\s*:' examples --include='*.yaml'); do
            uv run mapcan build "$f" -o "build/$(basename "$(dirname "$f")")-$(basename "$f" .yaml)" \
              --pdf-template mapcan --pdf-template gost-2.105
          done
      - uses: actions/upload-artifact@v6
        with:
          name: mapcan-build
          path: build/
