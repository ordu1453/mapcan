name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Schema is up to date
        run: uv run canmap schema -o schema/canmap.schema.json && git diff --exit-code schema/
      - name: Tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Typecheck and build
        working-directory: web
        run: npm ci && npm run build
      - name: Built bundle is committed and up to date
        run: git diff --exit-code src/canmap/web/static

  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Validate reference map
        run: uv run canmap validate canmap.yaml --strict
      - name: Build documents and code
        run: uv run canmap build canmap.yaml -o build
      - uses: actions/upload-artifact@v4
        with:
          name: canmap-build
          path: build/
