name: ci

# All jobs run on GitHub-hosted runners; self-hosted runners are not used in a public repository.

on:
  push:
    branches: ["**"]     # tags are checked by release.yml (it calls this workflow)
  pull_request:
  workflow_call:
    inputs:
      skip-linux:
        description: Do not run the test on Linux (ubuntu-latest)
        type: boolean
        default: false

# Read-only token by default, also for pull requests from forks.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra lsp
      - name: Lint
        run: uv run ruff check src tests
      - name: Schema is up to date
        run: |
          uv run mapcan schema -o schema/mapcan.schema.json
          uv run mapcan schema --part -o schema/mapcan-part.schema.json
          git diff --exit-code schema/
      - name: Tests
        run: uv run pytest

  test-linux:
    if: ${{ !inputs.skip-linux }}    # on a plain push inputs is empty, so the test runs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra lsp
      - run: uv run pytest

  # The core without extras (as in CI and firmware builds): validation and the light outputs work, and a
  # command that needs an extra says which one.
  core:
    if: ${{ !inputs.skip-linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --no-dev
      - name: Validate and build without extras
        run: |
          uv run --no-sync mapcan validate examples/j1939.yaml --strict
          uv run --no-sync mapcan build examples/j1939.yaml -o build --formats md,html,dbc,eds,c,py
      - name: A command that needs an extra names it
        run: |
          ! uv run --no-sync mapcan export pdf examples/j1939.yaml -o build/x.pdf 2> err.txt
          grep -F 'mapcan[pdf]' err.txt

  # The generated C code as firmware sees it: static analysis (cppcheck, and MISRA C:2012 through its addon,
  # for the code of the buses and of the devices of every example map; only the deviations listed in the test
  # are allowed), a build for Cortex-M and its code size within a budget.
  firmware:
    if: ${{ !inputs.skip-linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Install cppcheck and the Arm toolchain
        run: |
          uv pip install cppcheck==1.5.3 && uv run --no-sync cppcheck --version
          # newlib: string.h (memcpy) of the generated code
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi \
            libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version
      - name: cppcheck, MISRA C, Cortex-M build and code size
        env:
          MAPCAN_REQUIRE_CPPCHECK: "1"     # a missing cppcheck fails the job instead of skipping the test
        run: uv run --no-sync pytest tests/test_codegen.py -k "cppcheck_and_misra or cortex" -p no:cacheprovider

  # The Zephyr module and adapter: examples/zephyr (the bms of examples/vehicle-can.yaml, its code generated from
  # the map at build time) built for native_sim with Zephyr's loopback CAN driver and run for two seconds.
  zephyr:
    if: ${{ !inputs.skip-linux }}
    runs-on: ubuntu-latest
    env:
      ZEPHYR_VERSION: v4.1.0
      ZEPHYR_TOOLCHAIN_VARIANT: host     # native_sim builds with the host's gcc: no Zephyr SDK
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build tools, Zephyr and mapcan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler gperf
          git clone --depth 1 --branch "$ZEPHYR_VERSION" https://github.com/zephyrproject-rtos/zephyr ../zephyrproject/zephyr
          pip install west -r ../zephyrproject/zephyr/scripts/requirements-base.txt .
          west init -l ../zephyrproject/zephyr
      # west's commands (build) are those of the workspace: it runs there, with the paths of this repository
      - name: Build examples/zephyr for native_sim
        working-directory: ../zephyrproject
        run: |
          west build -b native_sim/native/64 "$GITHUB_WORKSPACE/examples/zephyr" \
            -d "$GITHUB_WORKSPACE/build/zephyr-app" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
      - name: Run it
        run: |
          build/zephyr-app/zephyr/zephyr.exe --stop_at=2 | tee zephyr.txt
          grep -F "bms: contactor request 2, torque request 1205 (raw)" zephyr.txt
          grep -F "bms: command timed out: yes" zephyr.txt

  # A trial build of the Docker image (without publishing): otherwise a broken Dockerfile shows up only
  # in release.yml after the tag.
  docker:
    if: ${{ !inputs.skip-linux }}    # in a release, release.yml builds and publishes the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mapcan:ci

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Typecheck and build
        working-directory: web
        run: npm ci && npm run build
      - name: Frontend tests
        working-directory: web
        run: npm test
      - name: Built bundle is committed and up to date
        run: git diff --exit-code src/mapcan/web/static
      # Browser smoke tests and the accessibility check (web/e2e) against `mapcan serve` from .venv
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra web
      - name: Browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: |
            web/playwright-report/
            web/test-results/

  # VS Code extension: types, build, .vsix package and integration tests in a real VS Code
  # (downloaded to vscode/.vscode-test/; the window is in an xvfb virtual display). The language server is from .venv.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra lsp
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Typecheck
        working-directory: vscode
        run: npm ci && npm run typecheck
      - name: Package
        working-directory: vscode
        run: npm run build && npm run package
      - name: Integration tests
        working-directory: vscode
        run: xvfb-run -a npm test

  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Use Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Maps only: a part of a map pulled in with include (examples/tractor) says so with "part_of:"
      - name: Find the maps
        run: grep -rlE '^mapcan\s*:' examples --include='*.yaml' | xargs grep -LE '^part_of\s*:' | tee maps.txt
      - name: Validate examples
        run: |
          for f in $(cat maps.txt); do uv run mapcan validate "$f" --strict; done
      - name: Examples are formatted (mapcan fmt)
        run: uv run mapcan fmt --check $(cat maps.txt)
      - name: Build documents and code for every example
        run: |
          for f in $(cat maps.txt); do
            uv run mapcan build "$f" -o "build/$(basename "$(dirname "$f")")-$(basename "$f" .yaml)" \
              --pdf-template mapcan --pdf-template gost-2.105
          done
      - uses: actions/upload-artifact@v6
        with:
          name: mapcan-build
          path: build/
