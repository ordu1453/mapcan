# yaml-language-server: $schema=../schema/mapcan.schema.json
# Minimal example: every kind of signal in one frame.

mapcan: 2

document:
  title: Example map
  version: 0.1.0
  language: en

buses:
  - name: demo
    title: Demo bus
    protocol: canopen
    bitrate: 500000
    devices:
      - name: pump
        short: PMP
        title: Pump
        node_id: 0x21
        frames:
          - name: pump_state          # ID = 0x180 + 0x21 = 0x1A1
            description: Pump state
            canopen: pdo_tx1
            length: 8
            cycle_ms: 100
            signals:
              - name: mode            # enum, byte 0
                description: Operating mode
                encoding: enum
                byte: 0
                byte_length: 1
                values:
                  0: {name: OFF, description: off}
                  1: {name: RUN, description: running}
                  2: {name: FAULT, description: fault}

              - name: alarms          # bit field, byte 1
                description: Alarms
                encoding: bitfield
                byte: 1
                byte_length: 1
                flags:
                  - {name: overheat, bit: 0, description: overheating}
                  - {name: dry_run, bit: 1, description: dry running}
                  - {name: sensor_state, bit: 4, bit_length: 2,
                     values: {0: OK, 1: OPEN, 2: SHORT}}

              - name: pressure        # quantity, bytes 2..3, little-endian
                description: Pressure
                encoding: number
                byte: 2
                byte_length: 2
                factor: 0.01
                unit: bar
                min: 0
                max: 16

              - name: temperature     # signed quantity with an offset
                description: Temperature
                encoding: number
                byte: 4
                byte_length: 1
                representation: twos_complement
                factor: 0.5
                offset: -20
                unit: °C

              - name: speed           # two bytes, little-endian (CANopen): byte 5 is the low byte
                description: Speed
                encoding: number
                byte: 5
                byte_length: 2
                unit: rpm

              - name: counter         # arbitrary position: bits 56..59
                description: Message counter
                encoding: number
                start_bit: 56
                bit_length: 4
