# yaml-language-server: $schema=../schema/mapcan.schema.json
# Minimal example: every kind of signal in one frame.

mapcan: 1

document:
  title: Example map
  version: 0.1.0
  language: en

buses:
  - name: demo
    title: Demo bus
    bitrate: 500000
    protocol: canopen
    devices:
      - name: pump
        short: PMP
        title: Pump
        node_id: 0x21
        frames:
          - name: pump_state          # ID = 0x180 + 0x21 = 0x1A1
            type: pdo_tx1
            description: Pump state
            cycle_ms: 100
            signals:
              - name: mode            # enum, byte 0
                encoding: enum
                description: Operating mode
                byte: 0
                values:
                  0: {name: OFF, description: off}
                  1: {name: RUN, description: running}
                  2: {name: FAULT, description: fault}

              - name: alarms          # bit field, byte 1
                encoding: bitfield
                description: Alarms
                byte: 1
                flags:
                  - {bit: 0, name: overheat, description: overheating}
                  - {bit: 1, name: dry_run, description: dry running}
                  - {bit: 4, bit_length: 2, name: sensor_state,
                     values: {0: OK, 1: OPEN, 2: SHORT}}

              - name: pressure        # quantity, bytes 2..3, little-endian
                encoding: metric
                description: Pressure
                byte: 2
                byte_length: 2
                factor: 0.01
                unit: bar
                min: 0
                max: 16

              - name: temperature     # signed quantity with an offset
                encoding: metric
                description: Temperature
                byte: 4
                signed: true
                factor: 0.5
                offset: -20
                unit: °C

              - name: speed           # big-endian: byte 5 is the high byte, byte 6 the low byte
                encoding: metric
                description: Speed
                byte: 5
                byte_length: 2
                byte_order: big_endian
                unit: rpm

              - name: counter         # arbitrary position: bits 56..59
                encoding: raw
                description: Message counter
                start_bit: 56
                bit_length: 4
