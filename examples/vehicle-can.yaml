# yaml-language-server: $schema=../schema/canmap.schema.json
#
# Пример карты без CANopen: CAN 2.0A/B с явными ID и шина CAN FD.
# Показаны float32/float64, big-endian, 29-битные ID, мультиплексор, получатели кадров,
# значения по умолчанию (initial) и «нет данных» (invalid).

canmap: 1

document:
  title: Пример карты электромобиля
  version: 0.1.0
  language: ru

buses:
  - name: powertrain
    title: Силовая шина
    bitrate: 500000
    protocol: can
    devices:
      - name: bms
        short: BMS
        title: Система управления батареей
        frames:
          - name: bms_status
            id: 0x100
            description: Состояние батареи
            cycle_ms: 100
            receivers: [vcu, dashboard]
            signals:
              - name: pack_voltage
                description: Напряжение батареи
                byte: 0
                kind: float
                unit: В
                min: 0
                max: 1000
              - name: pack_current
                description: Ток батареи (заряд — отрицательный)
                byte: 4
                kind: float
                unit: А
                initial: 0

          - name: bms_cells
            id: 0x18FF5001
            extended: true
            description: Напряжения ячеек, по три в кадре
            cycle_ms: 500
            receivers: [vcu]
            signals:
              - name: cell_group
                description: Группа ячеек
                byte: 0
                multiplexer: true
                values:
                  0: {name: CELLS_1_3, description: ячейки 1–3}
                  1: {name: CELLS_4_6, description: ячейки 4–6}
              - {name: cell_1, description: Ячейка 1, byte: 1, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: В, invalid: 0xFFFF, mux: 0}
              - {name: cell_2, description: Ячейка 2, byte: 3, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: В, invalid: 0xFFFF, mux: 0}
              - {name: cell_3, description: Ячейка 3, byte: 5, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: В, invalid: 0xFFFF, mux: 0}
              - {name: cell_4, description: Ячейка 4, byte: 1, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: В, invalid: 0xFFFF, mux: 1}
              - {name: cell_5, description: Ячейка 5, byte: 3, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: В, invalid: 0xFFFF, mux: 1}
              - {name: cell_6, description: Ячейка 6, byte: 5, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: В, invalid: 0xFFFF, mux: 1}

      - name: vcu
        short: VCU
        title: Блок управления автомобилем
        frames:
          - name: vcu_command
            id: 0x200
            description: Команды батарее и инвертору
            cycle_ms: 20
            receivers: [bms]
            signals:
              - name: contactor_request
                description: Запрос состояния контакторов
                byte: 0
                initial: 0
                values:
                  0: {name: OPEN, description: разомкнуть}
                  1: {name: PRECHARGE, description: предзаряд}
                  2: {name: CLOSE, description: замкнуть}
              - name: torque_request
                description: Запрос крутящего момента
                byte: 1
                byte_length: 2
                signed: true
                factor: 0.1
                unit: Н·м
                min: -500
                max: 500
                initial: 0
              - name: max_charge_current
                description: Допустимый ток заряда
                byte: 3
                kind: float
                byte_order: big_endian
                unit: А

      - name: dashboard
        short: ПП
        title: Панель приборов
        frames: []

  - name: logger
    title: Шина регистратора (CAN FD)
    bitrate: 500000
    protocol: can
    fd: true
    devices:
      - name: datalogger
        short: РЕГ
        title: Регистратор
        frames:
          - name: log_record
            id: 0x300
            description: Запись журнала
            dlc: 64
            transmission: {mode: event}
            signals:
              - name: timestamp
                description: Время записи
                byte: 0
                kind: float
                bit_length: 64
                unit: с
              - name: payload
                description: Данные записи
                byte: 8
                byte_length: 8
                kind: bytes
