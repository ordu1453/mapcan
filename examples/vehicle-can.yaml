# yaml-language-server: $schema=../schema/mapcan.schema.json
#
# Example map without CANopen: CAN 2.0A/B with explicit IDs and a CAN FD bus.
# Shows float32/float64, big-endian, 29-bit IDs, a multiplexer, frame receivers,
# default values (initial) and "not available" values (invalid).

mapcan: 1

document:
  title: Electric vehicle example map
  version: 0.1.0
  language: en

buses:
  - name: powertrain
    title: Powertrain bus
    bitrate: 500000
    protocol: can
    devices:
      - name: bms
        short: BMS
        title: Battery management system
        frames:
          - name: bms_status
            id: 0x100
            description: Battery state
            cycle_ms: 100
            receivers: [vcu, dashboard]
            signals:
              - name: pack_voltage
                description: Pack voltage
                byte: 0
                encoding: float
                unit: V
                min: 0
                max: 1000
              - name: pack_current
                description: Pack current (negative while charging)
                byte: 4
                encoding: float
                unit: A
                initial: 0

          - name: bms_cells
            id: 0x18FF5001
            extended: true
            description: Cell voltages, three per frame
            cycle_ms: 500
            receivers: [vcu]
            signals:
              - name: cell_group
                encoding: enum
                description: Cell group
                byte: 0
                multiplexer: true
                values:
                  0: {name: CELLS_1_3, description: cells 1–3}
                  1: {name: CELLS_4_6, description: cells 4–6}
              - {name: cell_1, encoding: metric, description: Cell 1, byte: 1, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid: 0xFFFF, mux: 0}
              - {name: cell_2, encoding: metric, description: Cell 2, byte: 3, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid: 0xFFFF, mux: 0}
              - {name: cell_3, encoding: metric, description: Cell 3, byte: 5, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid: 0xFFFF, mux: 0}
              - {name: cell_4, encoding: metric, description: Cell 4, byte: 1, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid: 0xFFFF, mux: 1}
              - {name: cell_5, encoding: metric, description: Cell 5, byte: 3, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid: 0xFFFF, mux: 1}
              - {name: cell_6, encoding: metric, description: Cell 6, byte: 5, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid: 0xFFFF, mux: 1}

      - name: vcu
        short: VCU
        title: Vehicle control unit
        frames:
          - name: vcu_command
            id: 0x200
            description: Commands to the battery and the inverter
            cycle_ms: 20
            receivers: [bms]
            signals:
              - name: contactor_request
                encoding: enum
                description: Requested contactor state
                byte: 0
                initial: 0
                values:
                  0: {name: OPEN, description: open}
                  1: {name: PRECHARGE, description: precharge}
                  2: {name: CLOSE, description: close}
              - name: torque_request
                encoding: metric
                description: Torque request
                byte: 1
                byte_length: 2
                signed: true
                factor: 0.1
                unit: N·m
                min: -500
                max: 500
                initial: 0
              - name: max_charge_current
                description: Maximum charge current
                byte: 3
                encoding: float
                byte_order: big_endian
                unit: A

      - name: dashboard
        short: IC
        title: Instrument cluster
        frames: []

  - name: logger
    title: Data logger bus (CAN FD)
    bitrate: 500000
    protocol: can
    fd: true
    devices:
      - name: datalogger
        short: LOG
        title: Data logger
        frames:
          - name: log_record
            id: 0x300
            description: Log record
            dlc: 64
            transmission: {mode: event}
            signals:
              - name: timestamp
                description: Record time
                byte: 0
                encoding: float
                bit_length: 64
                unit: s
              - name: payload
                description: Record data
                byte: 8
                byte_length: 8
                encoding: bytes
