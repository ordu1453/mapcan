# yaml-language-server: $schema=../schema/mapcan.schema.json
#
# Example map without CANopen: CAN 2.0A/B with explicit IDs and a CAN FD bus.
# Shows float32/float64, big-endian, 29-bit IDs, a multiplexer, frame receivers,
# default values (initial) and "not available" values (invalid).

mapcan: 1

document:
  title: Electric vehicle example map
  version: 0.1.0
  language: en

buses:
  - name: powertrain
    title: Powertrain bus
    bitrate: 500000
    protocol: can
    devices:
      - name: bms
        short: BMS
        title: Battery management system
        frames:
          - name: bms_status
            id: 0x100
            length: 8
            description: Battery state
            cycle_ms: 100
            receivers: [vcu, dashboard]
            signals:
              - name: pack_voltage
                description: Pack voltage
                byte: 0
                encoding: float
                unit: V
                min: 0
                max: 1000
              - name: pack_current
                description: Pack current (negative while charging)
                byte: 4
                encoding: float
                unit: A
                initial: 0

          - name: bms_cells
            id: 0x18FF5001
            extended: true
            length: 8
            description: Cell voltages, three per frame
            cycle_ms: 500
            receivers: [vcu]
            signals:
              - name: cell_group
                encoding: enum
                description: Cell group
                byte: 0
                byte_length: 1
                multiplexer: true
                values:
                  0: {name: CELLS_1_3, description: cells 1–3}
                  1: {name: CELLS_4_6, description: cells 4–6}
              - {name: cell_1, encoding: scaled, description: Cell 1, byte: 1, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid_raw: 0xFFFF, mux: 0}
              - {name: cell_2, encoding: scaled, description: Cell 2, byte: 3, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid_raw: 0xFFFF, mux: 0}
              - {name: cell_3, encoding: scaled, description: Cell 3, byte: 5, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid_raw: 0xFFFF, mux: 0}
              - {name: cell_4, encoding: scaled, description: Cell 4, byte: 1, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid_raw: 0xFFFF, mux: 1}
              - {name: cell_5, encoding: scaled, description: Cell 5, byte: 3, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid_raw: 0xFFFF, mux: 1}
              - {name: cell_6, encoding: scaled, description: Cell 6, byte: 5, byte_length: 2, byte_order: big_endian,
                 factor: 0.001, unit: V, invalid_raw: 0xFFFF, mux: 1}

      - name: vcu
        short: VCU
        title: Vehicle control unit
        frames:
          - name: vcu_command
            id: 0x200
            length: 8
            description: Commands to the battery and the inverter
            cycle_ms: 20
            receivers: [bms]
            signals:
              - name: contactor_request
                encoding: enum
                description: Requested contactor state
                byte: 0
                byte_length: 1
                initial: 0
                values:
                  0: {name: OPEN, description: open}
                  1: {name: PRECHARGE, description: precharge}
                  2: {name: CLOSE, description: close}
              - name: torque_request
                encoding: scaled
                description: Torque request
                byte: 1
                byte_length: 2
                representation: twos_complement
                factor: 0.1
                unit: N·m
                min: -500
                max: 500
                initial: 0
              - name: max_charge_current
                description: Maximum charge current
                byte: 3
                encoding: float
                byte_order: big_endian
                unit: A
          - name: vcu_map_info
            id: 0x7F0
            length: 7
            description: The map the VCU software was built from, sent on request
            trigger: on_request
            receivers: [dashboard]
            signals:
              - {name: map_major, encoding: raw, description: "Map version, major", byte: 0, byte_length: 1,
                 source: map_version.major}
              - {name: map_minor, encoding: raw, description: "Map version, minor", byte: 1, byte_length: 1,
                 source: map_version.minor}
              - {name: map_patch, encoding: raw, description: "Map version, patch", byte: 2, byte_length: 1,
                 source: map_version.patch}
              - {name: map_layout_crc, encoding: raw, description: CRC32 of the map's frame layouts, byte: 3,
                 byte_length: 4, source: layout_crc32}

      - name: dashboard
        short: IC
        title: Instrument cluster
        frames: []

  - name: logger
    title: Data logger bus (CAN FD)
    bitrate: 500000
    sample_point: 80
    protocol: can
    fd: true
    data_bitrate: 2000000     # the data field of frames with the bit rate switch (BRS)
    data_sample_point: 75
    devices:
      - name: datalogger
        short: LOG
        title: Data logger
        frames:
          - name: log_record
            id: 0x300
            description: Log record
            length: 64
            trigger: event
            signals:
              - name: timestamp
                description: Record time
                byte: 0
                encoding: float
                bit_length: 64
                unit: s
              - name: payload
                description: Record data
                byte: 8
                byte_length: 8
                encoding: bytes
