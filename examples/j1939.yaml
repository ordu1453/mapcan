# yaml-language-server: $schema=../schema/mapcan.schema.json
#
# SAE J1939 example map: engine, instrument cluster and a diagnostic tool.
# The 29-bit CAN ID is computed: priority | PGN (for PDU1 — with the destination address) | source address.
# J1939 "not available" values: 0xFF (1 byte), 0xFFFF (2 bytes).

mapcan: 2

document:
  title: J1939 example map
  subtitle: Engine and instrument cluster
  version: 0.1.0
  language: en

buses:
  - name: j1939
    title: J1939 bus
    protocol: j1939
    bitrate: 250000
    devices:
      - name: engine
        short: ECU
        title: Engine control unit
        address: 0x00
        frames:
          - name: eec1
            title: EEC1
            description: Electronic Engine Controller 1
            pgn: 0xF004
            priority: 3
            length: 8
            cycle_ms: 20
            timeout_ms: 60
            receivers: [cluster]
            signals:
              - name: torque_mode
                description: Engine torque mode
                encoding: enum
                start_bit: 0
                bit_length: 4
                values:
                  0: {name: LOW_IDLE, description: low idle}
                  1: {name: ACCELERATOR, description: accelerator pedal}
                  2: {name: CRUISE, description: cruise control}
                  15: {name: NOT_AVAILABLE, description: not available}
                spn: 899
              - name: demand_torque
                description: Driver's demand torque
                encoding: number
                byte: 1
                byte_length: 1
                offset: -125
                unit: "%"
                min: -125
                max: 125
                invalid_raw: 0xFF
                spn: 512
              - name: actual_torque
                description: Actual engine torque
                encoding: number
                byte: 2
                byte_length: 1
                offset: -125
                unit: "%"
                min: -125
                max: 125
                invalid_raw: 0xFF
                spn: 513
              - name: engine_speed
                description: Engine speed
                encoding: number
                byte: 3
                byte_length: 2
                factor: 0.125
                unit: rpm
                min: 0
                max: 8031.875
                initial: 0
                # J1939-71 ranges of a 2-byte parameter
                invalid_raw: {not_available: [0xFF00..0xFFFF], error: [0xFE00..0xFEFF]}
                spn: 190
              - name: controlling_address
                description: Address of the device controlling the engine
                encoding: number
                byte: 5
                byte_length: 1
                value_format: hex
                spn: 1483

          - name: et1
            title: ET1
            description: Engine Temperature 1
            pgn: 0xFEEE
            length: 8
            cycle_ms: 1000
            receivers: [cluster]
            signals:
              - name: coolant_temp
                description: Coolant temperature
                encoding: number
                byte: 0
                byte_length: 1
                offset: -40
                unit: °C
                min: -40
                max: 210
                invalid_raw: 0xFF
                spn: 110
              - name: fuel_temp
                description: Fuel temperature
                encoding: number
                byte: 1
                byte_length: 1
                offset: -40
                unit: °C
                invalid_raw: 0xFF
                spn: 174
              - name: oil_temp
                description: Oil temperature
                encoding: number
                byte: 2
                byte_length: 2
                factor: 0.03125
                offset: -273
                unit: °C
                invalid_raw: 0xFFFF
                spn: 175

          - name: soft
            title: SOFT
            description: Software identification (longer than 8 bytes, sent with the transport protocol)
            pgn: 0xFEDA
            length: 20
            trigger: on_request
            receivers: [diag]
            signals:
              - name: software_id
                description: Software identification fields, separated by '*'
                encoding: bytes
                byte: 0
                byte_length: 20
                charset: ascii
                terminator: "*"
                spn: 234

      - name: cluster
        short: IC
        title: Instrument cluster
        address: 0x17
        frames:
          - name: dash_display
            title: DD
            description: Dash Display
            pgn: 0xFEFC
            length: 8
            cycle_ms: 1000
            receivers: [engine]
            signals:
              - name: fuel_level
                description: Fuel level
                encoding: number
                byte: 1
                byte_length: 1
                factor: 0.4
                unit: "%"
                min: 0
                max: 100
                invalid_raw: 0xFF
                spn: 96

      - name: diag
        short: DT
        title: Diagnostic tool
        address: 0xF9
        frames:
          - name: request_to_engine
            title: RQST
            description: PGN request to the engine (PDU1, addressed)
            pgn: 0xEA00
            destination: 0x00
            length: 3
            trigger: on_request
            receivers: [engine]
            signals:
              - name: requested_pgn
                description: Requested PGN
                encoding: enum
                start_bit: 0
                bit_length: 24
                values:
                  0xFEEE: {name: ET1, description: engine temperatures}
                  0xFEE5: {name: ENGINE_HOURS, description: engine hours}
                value_format: hex
                spn: 2540
