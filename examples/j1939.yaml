# yaml-language-server: $schema=../schema/mapcan.schema.json
#
# SAE J1939 example map: engine, instrument cluster and a diagnostic tool.
# The 29-bit CAN ID is computed: priority | PGN (for PDU1 — with the destination address) | source address.
# J1939 "not available" values: 0xFF (1 byte), 0xFFFF (2 bytes).

mapcan: 1

document:
  title: J1939 example map
  subtitle: Engine and instrument cluster
  version: 0.1.0
  language: en

buses:
  - name: j1939
    title: J1939 bus
    bitrate: 250000
    protocol: j1939
    devices:
      - name: engine
        short: ECU
        title: Engine control unit
        address: 0x00
        frames:
          - name: eec1
            title: EEC1
            description: Electronic Engine Controller 1
            pgn: 0xF004
            priority: 3
            dlc: 8
            cycle_ms: 20
            receivers: [cluster]
            signals:
              - name: torque_mode
                encoding: enum
                description: Engine torque mode
                start_bit: 0
                bit_length: 4
                values:
                  0: {name: LOW_IDLE, description: low idle}
                  1: {name: ACCELERATOR, description: accelerator pedal}
                  2: {name: CRUISE, description: cruise control}
                  15: {name: NOT_AVAILABLE, description: not available}
              - name: demand_torque
                encoding: scaled
                description: Driver's demand torque
                byte: 1
                byte_length: 1
                unit: "%"
                offset: -125
                min: -125
                max: 125
                invalid: 0xFF
              - name: actual_torque
                encoding: scaled
                description: Actual engine torque
                byte: 2
                byte_length: 1
                unit: "%"
                offset: -125
                min: -125
                max: 125
                invalid: 0xFF
              - name: engine_speed
                encoding: scaled
                description: Engine speed
                byte: 3
                byte_length: 2
                factor: 0.125
                unit: rpm
                min: 0
                max: 8031.875
                initial: 0
                invalid: 0xFFFF
              - name: controlling_address
                encoding: raw
                description: Address of the device controlling the engine
                byte: 5
                byte_length: 1
                value_format: hex

          - name: et1
            title: ET1
            description: Engine Temperature 1
            pgn: 0xFEEE
            dlc: 8
            cycle_ms: 1000
            receivers: [cluster]
            signals:
              - name: coolant_temp
                encoding: scaled
                description: Coolant temperature
                byte: 0
                byte_length: 1
                offset: -40
                unit: °C
                min: -40
                max: 210
                invalid: 0xFF
              - name: fuel_temp
                encoding: scaled
                description: Fuel temperature
                byte: 1
                byte_length: 1
                offset: -40
                unit: °C
                invalid: 0xFF
              - name: oil_temp
                encoding: scaled
                description: Oil temperature
                byte: 2
                byte_length: 2
                factor: 0.03125
                offset: -273
                unit: °C
                invalid: 0xFFFF

      - name: cluster
        short: IC
        title: Instrument cluster
        address: 0x17
        frames:
          - name: dash_display
            title: DD
            description: Dash Display
            pgn: 0xFEFC
            dlc: 8
            cycle_ms: 1000
            receivers: [engine]
            signals:
              - name: fuel_level
                encoding: scaled
                description: Fuel level
                byte: 1
                byte_length: 1
                factor: 0.4
                unit: "%"
                min: 0
                max: 100
                invalid: 0xFF

      - name: diag
        short: DT
        title: Diagnostic tool
        address: 0xF9
        frames:
          - name: request_to_engine
            title: RQST
            description: PGN request to the engine (PDU1, addressed)
            pgn: 0xEA00
            destination: 0x00
            dlc: 3
            trigger: on_request
            receivers: [engine]
            signals:
              - name: requested_pgn
                encoding: enum
                description: Requested PGN
                start_bit: 0
                bit_length: 24
                value_format: hex
                values:
                  0xFEEE: {name: ET1, description: engine temperatures}
                  0xFEE5: {name: ENGINE_HOURS, description: engine hours}
